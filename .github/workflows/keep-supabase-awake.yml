name: Keep Supabase awake

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row
        run: |
          KEY=sb_publishable_SydrZ17z4xJGOVT7B7yZAA_UrG6qJSV
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            "https://jeztkwnvfewhnaadaazh.supabase.co/rest/v1/keepalive?on_conflict=id" \
            -d "{\"id\":1,\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
